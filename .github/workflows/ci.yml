name: Balcony Hydra CI

# ============================================================
# Durcissement P0 (2026-05-29) — voir DECISIONS.md
#  - reproductibilité : platform + lib_deps + platformio ÉPINGLÉS
#  - sécurité : secrets-scan, deps (npm audit), CodeQL, dependency-review
#  - durcissement : permissions least-privilege, concurrency, timeouts
#  - couverture déclencheur : firmware/** + mobile-app/** + workflows
#
# P1 (2026-05-29) :
#  - HARD-GATE : npm audit (deps CVE), + garde-fou ABI ESP-NOW (protocol-check)
#    + cliquet de couverture mobile (vitest 90/90/82/90).
#  - BEST-EFFORT (continue-on-error) : gitleaks (licence/config requise),
#    dependency-review + CodeQL (exigent GitHub Advanced Security, indispo sur
#    ce repo). Deviennent hard-gate si repo public OU GHAS activé OU, pour les
#    secrets, en activant le secret scanning natif GitHub / un binaire gitleaks.
#
# RESTE (nécessite réseau/HW) : SHA-pin de chaque `uses:` (tags @vN → SHA) ;
# couverture firmware gcov + seuil.
# ============================================================

on:
  push:
    branches: [main, develop]
    paths: ['firmware/**', 'mobile-app/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['firmware/**', 'mobile-app/**', '.github/workflows/**']
  workflow_dispatch:

# Least privilege par défaut (un job qui a besoin de plus l'élève localement).
permissions:
  contents: read

# Annule les runs obsolètes sur une même réf (économie + feedback rapide).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIO_VERSION: "6.1.19"   # PlatformIO Core épinglé (reproductibilité)

jobs:
  # ---------------- Sécurité : scan de secrets ----------------
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        # Best-effort : gitleaks-action exige une licence/config absente ici
        # (échec sur PR #3) → non-bloquant. Alternatives hard-gate possibles :
        # licence gitleaks, OU binaire gitleaks lancé en direct, OU push
        # protection GitHub (secret scanning natif). Voir note PR.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------- Sécurité : dépendances ----------------
  deps-scan:
    name: Deps vuln scan (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit (high+)
        # P1 : hard-gate (0 vuln high sur PR #2). Une vuln high bloque désormais.
        run: npm audit --audit-level=high
      # TODO P1 : osv-scanner pour les libs firmware (PlatformIO) — pas de feed
      # CVE simple aujourd'hui ; à instrumenter séparément.

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        # Best-effort : exige le Dependency graph / GitHub Advanced Security
        # (indisponible sur ce repo → non-bloquant). Retirer continue-on-error
        # une fois GHAS activé OU le repo passé public.
        continue-on-error: true

  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
        # Best-effort : code scanning exige GitHub Advanced Security (indispo
        # sur ce repo) → non-bloquant. Hard-gate possible si repo public/GHAS.
        continue-on-error: true
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true

  # ---------------- Build firmware (reproductible) ----------------
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-master-${{ hashFiles('firmware/master/platformio.ini') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO (épinglé)
        run: pip install "platformio==${PIO_VERSION}"
      - name: Build Master Firmware
        run: cd firmware/master && pio run -e master
      - name: Run Master Unit Tests (native — no hardware)
        run: cd firmware/master && pio test -e native --verbose
      - name: Check firmware size
        run: cd firmware/master && pio run -e master -t size
      - name: Upload master .bin artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-master-${{ github.sha }}
          path: |
            firmware/master/.pio/build/master/firmware.bin
            firmware/master/.pio/build/master/firmware.elf
            firmware/master/.pio/build/master/partitions.bin
            firmware/master/.pio/build/master/bootloader.bin
          retention-days: 30
          if-no-files-found: warn

  build-slave:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-slave-${{ hashFiles('firmware/slave/platformio.ini') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO (épinglé)
        run: pip install "platformio==${PIO_VERSION}"
      - name: Build Slave Firmware
        run: cd firmware/slave && pio run -e slave
      - name: Run Slave Unit Tests (native — no hardware)
        run: cd firmware/slave && pio test -e native --verbose
      - name: Check firmware size
        run: cd firmware/slave && pio run -e slave -t size
      - name: Upload slave .bin artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-slave-${{ github.sha }}
          path: |
            firmware/slave/.pio/build/slave/firmware.bin
            firmware/slave/.pio/build/slave/firmware.elf
            firmware/slave/.pio/build/slave/partitions.bin
            firmware/slave/.pio/build/slave/bootloader.bin
          retention-days: 30
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # lint — pio check (cppcheck) sur les deux firmwares. HARD GATE.
  #   escalier : high (2026-05-18 am) → medium (actuel) → low (futur).
  #   Si un bump rougit la CI : revert à high + fixer les MEDIUM à part.
  # ----------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.firmware }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        firmware: [master, slave]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO (épinglé)
        run: pip install "platformio==${PIO_VERSION}"
      - name: Run pio check (${{ matrix.firmware }})
        run: cd firmware/${{ matrix.firmware }} && pio check --skip-packages --fail-on-defect=medium

  protocol-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify Protocol.h consistency
        run: |
          echo "Checking Protocol.h is identical in common/"
          if [ -f firmware/common/Protocol.h ]; then
            echo "Protocol.h exists in common/ ✅"
            echo "Size: $(wc -c < firmware/common/Protocol.h) bytes"
            echo "Structs: $(grep -c 'struct __attribute__' firmware/common/Protocol.h)"
            echo "Commands: $(grep -c 'CMD_' firmware/common/Protocol.h)"
            echo "Data types: $(grep -c 'DATA_' firmware/common/Protocol.h)"
          else
            echo "Protocol.h MISSING ❌"
            exit 1
          fi
      - name: Check config_common.h
        run: |
          echo "Checking shared constants..."
          grep -c 'constexpr' firmware/common/config_common.h
          echo "Constants defined ✅"
      - name: ABI / wire-format guard (ESP-NOW)
        run: |
          # Garde-fou binaire : static_assert sur sizeof/offsetof des messages
          # Protocol.h. Toute dérive du format sur-le-fil maître↔esclave casse ici.
          g++ -std=c++17 -I firmware/common -I firmware/master/test/mocks \
            tools/protocol_abi_check.cpp -o /tmp/abi_check
          /tmp/abi_check
          echo "ABI ESP-NOW stable ✅"
      # NOTE P1 : static_assert(sizeof(...)) sur les structs ESP-NOW
      # + comparaison à un golden ABI (offsets/packing) master↔esclave.

  # ----------------------------------------------------------------
  # Mobile app — Vite + TypeScript + Vitest
  # ----------------------------------------------------------------
  mobile-app:
    name: Mobile app (TS + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests + coverage
        run: npm run test:coverage
      - name: Build PWA
        run: npm run build
      - name: Build standalone (single-file)
        run: npm run build:standalone
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-${{ github.sha }}
          path: mobile-app/coverage
          retention-days: 30
      - name: Upload PWA build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-pwa-${{ github.sha }}
          path: mobile-app/dist
          retention-days: 30

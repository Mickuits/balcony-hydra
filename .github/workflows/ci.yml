name: Balcony Hydra CI

on:
  push:
    branches: [main, develop]
    paths: ['firmware/**']
  pull_request:
    branches: [main]
    paths: ['firmware/**']

jobs:
  build-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-master-${{ hashFiles('firmware/master/platformio.ini') }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Master Firmware
        run: |
          cd firmware/master
          pio run -e master

      - name: Run Master Unit Tests (native — no hardware)
        run: |
          cd firmware/master
          pio test -e native --verbose

      - name: Check firmware size
        run: |
          cd firmware/master
          pio run -e master -t size

      # Upload firmware.bin sur builds de main → permet de re-flasher
      # une release passée sans rebuild. Retention 30j.
      - name: Upload master .bin artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-master-${{ github.sha }}
          path: |
            firmware/master/.pio/build/master/firmware.bin
            firmware/master/.pio/build/master/firmware.elf
            firmware/master/.pio/build/master/partitions.bin
            firmware/master/.pio/build/master/bootloader.bin
          retention-days: 30
          if-no-files-found: warn

  build-slave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-slave-${{ hashFiles('firmware/slave/platformio.ini') }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Slave Firmware
        run: |
          cd firmware/slave
          pio run -e slave

      - name: Run Slave Unit Tests (native — no hardware)
        run: |
          cd firmware/slave
          pio test -e native --verbose

      - name: Check firmware size
        run: |
          cd firmware/slave
          pio run -e slave -t size

      # Upload firmware.bin sur builds de main → permet de re-flasher
      # une release passée sans rebuild. Retention 30j.
      - name: Upload slave .bin artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-slave-${{ github.sha }}
          path: |
            firmware/slave/.pio/build/slave/firmware.bin
            firmware/slave/.pio/build/slave/firmware.elf
            firmware/slave/.pio/build/slave/partitions.bin
            firmware/slave/.pio/build/slave/bootloader.bin
          retention-days: 30
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # lint — pio check (cppcheck) on both firmwares.
  #
  # HARD GATE en escalier :
  #   2026-05-18 (am) : --fail-on-defect=high
  #   2026-05-18 (pm) : --fail-on-defect=medium  ← actuel
  #   (futur)         : --fail-on-defect=low (quand medium reste vert
  #                      sur plusieurs commits consécutifs)
  #
  # Si le bump fait rouge le CI : revert à --fail-on-defect=high et
  # fixer les defects MEDIUM dans un commit séparé avant de re-bumper.
  # Le palier intermédiaire (high → medium → low) évite un mur de
  # warnings à traiter d'un coup.
  # ----------------------------------------------------------------
  lint:
    name: Lint (${{ matrix.firmware }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware: [master, slave]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run pio check (${{ matrix.firmware }})
        run: |
          cd firmware/${{ matrix.firmware }}
          pio check --skip-packages --fail-on-defect=medium

  protocol-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify Protocol.h consistency
        run: |
          echo "Checking Protocol.h is identical in common/"
          if [ -f firmware/common/Protocol.h ]; then
            echo "Protocol.h exists in common/ ✅"
            echo "Size: $(wc -c < firmware/common/Protocol.h) bytes"
            echo "Structs: $(grep -c 'struct __attribute__' firmware/common/Protocol.h)"
            echo "Commands: $(grep -c 'CMD_' firmware/common/Protocol.h)"
            echo "Data types: $(grep -c 'DATA_' firmware/common/Protocol.h)"
          else
            echo "Protocol.h MISSING ❌"
            exit 1
          fi

      - name: Check config_common.h
        run: |
          echo "Checking shared constants..."
          grep -c 'constexpr' firmware/common/config_common.h
          echo "Constants defined ✅"

  # ----------------------------------------------------------------
  # Mobile app — Vite + TypeScript + Vitest (introduced 2026-05-18,
  # refactor production-quality du proto HTML legacy)
  # ----------------------------------------------------------------
  mobile-app:
    name: Mobile app (TS + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build PWA
        run: npm run build

      - name: Build standalone (single-file)
        run: npm run build:standalone

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage-${{ github.sha }}
          path: mobile-app/coverage
          retention-days: 30

      - name: Upload PWA build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-pwa-${{ github.sha }}
          path: mobile-app/dist
          retention-days: 30

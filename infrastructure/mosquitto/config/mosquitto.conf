# =============================================================
# Mosquitto config — Balcony Hydra v4
# =============================================================

# ─── Identification ─────────────────────────────────────────────
# Persistance des sessions et des messages retain
persistence true
persistence_location /mosquitto/data/

# ─── Logs ──────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
connection_messages true

# ─── Auth ──────────────────────────────────────────────────────
# Pas d'accès anonyme. Voir docker-compose.yml en-tête pour créer
# les users avec mosquitto_passwd. Au minimum un user "hydra" pour
# le firmware master et un user "mobile" pour l'app.
allow_anonymous false
password_file /mosquitto/config/passwd

# ─── ACL (optionnel — fine-grain par topic) ────────────────────
# Décommente + adapte si tu veux restreindre par user.
# acl_file /mosquitto/config/acl

# ─── Listener MQTT classique (port 1883) ───────────────────────
# Utilisé par le firmware ESP32 master via PubSubClient.
listener 1883
protocol mqtt

# ─── Listener WebSocket (port 9001) ────────────────────────────
# Utilisé par l'app mobile depuis navigateur. mqtt.js connect en
# ws://host:9001 (ou wss://host:9001 derrière reverse proxy TLS).
listener 9001
protocol websockets

# ─── Limits ────────────────────────────────────────────────────
# Payload max 256 KB (largement au-dessus des plus gros payloads
# Hydra : pump.toJson ~700 bytes en pire cas).
message_size_limit 262144

# Backlog connect : si plusieurs ESP32 redémarrent en même temps
# (panne secteur), évite que mosquitto rejette les connexions.
max_queued_messages 1000
max_inflight_messages 20

# Keepalive minimum 10s — protège contre clients qui spamment ping
# (firmware Hydra a un keepalive interne PubSubClient configuré).
max_keepalive 600

# ─── Notes ─────────────────────────────────────────────────────
# - Le firmware ESP32 master publie sur hydra/sensors, hydra/pump,
#   hydra/alerts et souscrit à hydra/cmd/#.
# - L'app mobile (Phase 2) souscrira aux mêmes topics + publishera
#   éventuellement sur hydra/cmd/* (alternative à REST).
# - Pour HTTPS/WSS en production : ajouter un reverse proxy nginx
#   ou Traefik devant. Mosquitto peut aussi gérer TLS directement
#   via les directives `cafile`, `certfile`, `keyfile`.

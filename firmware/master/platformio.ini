; ============================================================
; PlatformIO — Balcony Hydra v4 MASTER (Intérieur)
; ============================================================

[env:master]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA
upload_protocol = espota
upload_port = hydra-master.local

; Build flags
build_flags = 
    -DHYDRA_MASTER
    -DCORE_DEBUG_LEVEL=3
    -I../../common

; Libraries
lib_deps = 
    bblanchon/ArduinoJson@^7.0
    me-no-dev/ESPAsyncWebServer@^1.2.3
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit INA219@^1.2.1
    witnessmenow/Universal-Telegram-Bot@^1.3.0
    bodmer/TFT_eSPI@^2.5.0
    paulstoffregen/XPT2046_Touchscreen@^1.4

; TFT_eSPI configuration (ILI9341 via VSPI)
build_flags_tft =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_MISO=19
    -DTFT_SCLK=18
    -DTFT_CS=13
    -DTFT_DC=12
    -DTFT_RST=-1
    -DTOUCH_CS=15
    -DSPI_FREQUENCY=40000000

; ---- Native test environment (runs on PC, no hardware) ----
[env:native]
platform = native
test_build_src = false
build_flags = 
    -I../../common
    -Itest/mocks
    -std=c++17
    -DHYDRA_MASTER
    -DUNITY_INCLUDE_DOUBLE
test_filter = test_functional

; ============================================================
; PlatformIO — Balcony Hydra v4 MASTER (Intérieur)
; ============================================================

[env:master]
; Versions ÉPINGLÉES (reproductibilité) — alignées sur le dernier build vert.
; Ne PAS repasser en flottant (^/latest) : c'est ce qui a cassé la CI (dérive
; espressif32 6.x→7.0.1, ArduinoJson→7.4.3). Bump volontaire + testé uniquement.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA
upload_protocol = espota
upload_port = hydra-master.local

; Build flags
build_flags =
    -DHYDRA_MASTER
    -DCORE_DEBUG_LEVEL=3
    -I$PROJECT_DIR/../common
    -I$PROJECT_DIR/include

; Libraries
; Versions EXACTES (reproductibilité) = graphe de dépendances du build vert.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ; Fork maintenu (ESP32Async/mathieucarbou) : compatible espressif32 7.x et
    ; expose collectHeaders ; l'ancien me-no-dev/ESPAsyncWebServer@1.2.x est
    ; cassé sur ESP32 core récent. AsyncTCP épinglé explicitement (sinon
    ; résolution transitive non déterministe).
    mathieucarbou/ESPAsyncWebServer@3.6.0
    mathieucarbou/AsyncTCP@3.3.2
    knolleary/PubSubClient@2.8
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit INA219@1.2.3
    https://github.com/witnessmenow/Universal-Arduino-Telegram-Bot.git#V1.3.0
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; ============================================================
; TFT_eSPI pinout — pinout RÉSOLU, à ACTIVER au 1er flash HW
; ============================================================
; Pinout remappé 2026-05-29 (cf. DECISIONS.md) qui résout le conflit GPIO 18 :
;   CLK 18->19, MISO 19->35 (input-only, OK pour MISO), MOSI 23 inchangé.
;   Le Relay sécurité garde GPIO 18 sans collision.
;
; ⚠ Volontairement COMMENTÉ tant qu'aucun écran n'est branché : activer
;   USER_SETUP_LOADED force TFT_eSPI à utiliser CES flags au lieu de son
;   User_Setup.h embarqué — non validable en CI (pas d'écran), donc on attend
;   le 1er flash. Procédure : décommenter le bloc ci-dessous puis suivre
;   docs/hardware_bringup_checklist.md §0 (init écran + tactile).
;
;   ⮕ Pour activer : copier ces lignes dans `build_flags = ` ci-dessus.
;
; -DUSER_SETUP_LOADED=1
; -DILI9341_DRIVER=1
; -DTFT_WIDTH=240
; -DTFT_HEIGHT=320
; -DTFT_MOSI=23
; -DTFT_MISO=35
; -DTFT_SCLK=19
; -DTFT_CS=13
; -DTFT_DC=12
; -DTFT_RST=-1
; -DTOUCH_CS=15
; -DLOAD_GLCD=1
; -DSPI_FREQUENCY=40000000
; -DSPI_TOUCH_FREQUENCY=2500000

; ---- Native test environment (runs on PC, no hardware) ----
[env:native]
platform = native
test_build_src = false
build_flags =
    -I$PROJECT_DIR/../common
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/test/mocks
    -std=c++17
    -DHYDRA_MASTER
    -DHYDRA_TEST
    -DUNITY_INCLUDE_DOUBLE
test_filter = test_functional

; Activer la compilation des vrais modules lib/ en SIL natif.
; lib_extra_dirs expose lib/ au scanner PlatformIO pour les modules
; à logique pure (ConfigManager, SensorManager, PumpController, etc.).
;
; Modules ignorés car dépendances ESP32-only non mockables proprement :
;   - TftDashboard    : TFT_eSPI + XPT2046 + SPI hardware
;   - WifiManager     : WiFi.h + ESPmDNS + DNSServer (ESP32 SDK)
;   - WebPortal       : ESPAsyncWebServer + AsyncTCP
;   - MqttClient      : PubSubClient + WiFiClient
;   - TelegramBot     : UniversalTelegramBot + WiFiClientSecure
;   - EspNowMaster    : esp_now.h (ESP32-IDF uniquement)
;   - WiFiGeolocation : WiFi.h scan APIs (ESP32 uniquement)
;   - TimeManager     : stub dans test/mocks/ a la priorite (voir ci-dessous)
;   - PlantProfile    : stub dans test/mocks/ a la priorite (voir ci-dessous)
;
; Option choisie pour TimeManager et PlantProfile : Option A (lib_ignore).
; Quand lib_extra_dirs = lib est actif, PlatformIO injecte les paths
; lib/<Module>/ AVANT -Itest/mocks dans la chaine d'include, ce qui ferait
; trouver le vrai header avant le stub mock. En les placant dans lib_ignore,
; leurs dossiers lib/ sont ignores entierement, et -Itest/mocks (declare dans
; build_flags) resout les includes vers les stubs corrects.
lib_extra_dirs = lib
lib_ignore =
    TftDashboard
    WifiManager
    WebPortal
    MqttClient
    TelegramBot
    EspNowMaster
    WiFiGeolocation
    TimeManager
    PlantProfile
    SleepManager

; ---- Coverage env : native + instrumentation gcov ----
; Identique à [env:native] mais compilé/linké avec --coverage (gcov), -O0 -g
; pour mesurer la couverture lignes des modules lib/ exercés en SIL.
; Séparé de [env:native] pour garder l'exécution des tests (build-master CI)
; rapide et non instrumentée. Usage : pio test -e native_cov puis gcovr.
[env:native_cov]
extends = env:native
extra_scripts = pre:coverage.py
build_flags =
    ${env:native.build_flags}
    --coverage
    -O0
    -g
build_unflags = -O2

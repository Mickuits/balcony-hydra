; Balcony Hydra v3 — PlatformIO Configuration
; ESP32 DevKit WROOM-32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Partition scheme with OTA support
board_build.partitions = min_spiffs.csv

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DHYDRA_VERSION=\"3.0.0\"

; Dependencies
lib_deps = 
    bblanchon/ArduinoJson@^7.0
    knolleary/PubSubClient@^2.8
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    adafruit/Adafruit BME280 Library@^2.2
    adafruit/Adafruit INA219@^1.2
    witnessmenow/Universal-Arduino-Telegram-Bot@^1.3

; Monitor filters
monitor_filters = 
    esp32_exception_decoder
    time

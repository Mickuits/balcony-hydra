; ============================================================
; PlatformIO — Balcony Hydra v4 SLAVE (Balcon)
; ============================================================

[env:slave]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA
upload_protocol = espota
upload_port = hydra-slave.local

; Build flags
build_flags =
    -DHYDRA_SLAVE
    -DCORE_DEBUG_LEVEL=3
    -I$PROJECT_DIR/../common
    -I$PROJECT_DIR/include

; Libraries (subset — no TFT, no Telegram, no WebPortal)
lib_deps =
    bblanchon/ArduinoJson@^7.0
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit INA219@^1.2.1

; ---- Environnement de test natif (tourne sur PC, sans hardware) ----
; Teste uniquement Protocol.h et config_common.h : types purs, aucune
; dépendance ESP32. Les modules lib/ (SensorManager, PumpController, etc.)
; ne sont PAS compilés ici — ils dépendent de l'API Arduino ESP32-only.
[env:native]
platform = native
test_build_src = false
build_flags =
    -I$PROJECT_DIR/../common
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/test/mocks
    -std=c++17
    -DHYDRA_SLAVE
    -DUNITY_INCLUDE_DOUBLE
test_filter = test_main

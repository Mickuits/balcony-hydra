; ============================================================
; PlatformIO — Balcony Hydra v4 SLAVE (Balcon)
; ============================================================

[env:slave]
; Versions ÉPINGLÉES (reproductibilité) — voir note dans master/platformio.ini.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA
upload_protocol = espota
upload_port = hydra-slave.local

; Build flags
build_flags =
    -DHYDRA_SLAVE
    -DCORE_DEBUG_LEVEL=3
    -I$PROJECT_DIR/../common
    -I$PROJECT_DIR/include

; Libraries (subset — no TFT, no Telegram, no WebPortal) — versions EXACTES.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit BME280 Library@2.3.0
    adafruit/Adafruit INA219@1.2.3

; ---- Environnement de test natif (tourne sur PC, sans hardware) ----
; Teste Protocol.h + config_common.h (types purs) AINSI QUE les modules
; à logique pure DegradedMode + SafetyLocal (mode dégradé E2E), instanciés
; pour de vrai contre un mock HAL (millis contrôlable + NVS en mémoire).
;
; Les autres modules lib/ restent NON compilés ici : ils dépendent d'API
; ESP32-only non mockables proprement (esp_now.h, ledc, ADC/pulseIn HW) →
; lib_ignore. Le scanner ne tire que DegradedMode/SafetyLocal car ce sont
; les seuls headers inclus par test_main.cpp.
[env:native]
platform = native
test_build_src = false
build_flags =
    -I$PROJECT_DIR/../common
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/test/mocks
    -std=c++17
    -DHYDRA_SLAVE
    -DUNITY_INCLUDE_DOUBLE
test_filter = test_main
lib_extra_dirs = lib
lib_ignore =
    SensorManager
    PumpController
    EspNowSlave
    StatusLED
    ConfigManager

; ---- Coverage env : native + instrumentation gcov ----
; Identique à [env:native] mais compilé/linké avec --coverage (gcov), -O0 -g
; pour mesurer la couverture lignes de DegradedMode + SafetyLocal en SIL.
; Séparé de [env:native] pour garder l'exécution des tests (build-slave CI)
; rapide et non instrumentée. Usage : pio test -e native_cov puis gcovr.
[env:native_cov]
extends = env:native
extra_scripts = pre:coverage.py
build_flags =
    ${env:native.build_flags}
    --coverage
    -O0
    -g
build_unflags = -O2

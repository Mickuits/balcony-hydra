; ============================================================
; PlatformIO — Balcony Hydra v4 SLAVE (Balcon)
; ============================================================

[env:slave]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA
upload_protocol = espota
upload_port = hydra-slave.local

; Build flags
build_flags = 
    -DHYDRA_SLAVE
    -DCORE_DEBUG_LEVEL=3
    -I../../common

; Libraries (subset — no TFT, no Telegram, no WebPortal)
lib_deps = 
    bblanchon/ArduinoJson@^7.0
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit INA219@^1.2.1

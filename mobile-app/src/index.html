<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Balcony Hydra v4 — Control App</title>

    <!--
      Content Security Policy — défense en profondeur XSS.

      Justification des compromis :
      - 'unsafe-inline' sur style-src : les screens utilisent des `style="height:X%"`
        pour les jauges (pots/tanks). Refactor vers CSS vars prévu en VAGUE 5.B.
      - connect-src http:/https:/ws:/wss: : le master peut être en LAN ou via
        relais MQTT — pas de domaine fixe possible.
      - object-src 'none' + frame-ancestors 'none' + base-uri 'self' :
        verrouillage strict des vecteurs d'injection HTML.
      - trusted-types : enforce DOM XSS prevention via Trusted Types API
        (Chrome/Edge) — fallback silencieux sur Firefox/Safari.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data:;
        connect-src 'self' http: https: ws: wss:;
        manifest-src 'self';
        worker-src 'self';
        object-src 'none';
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
      "
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="application-name" content="Hydra" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hydra" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Skip link a11y — visible uniquement au focus clavier -->
    <a href="#mainContent" class="skip-link">Aller au contenu principal</a>

    <div class="app" id="app" role="application" aria-label="Balcony Hydra contrôle">
      <!-- MQTT connection banner (caché par défaut) -->
      <div id="mqttBanner" class="mqtt-banner" hidden>
        <span id="mqttBannerDot" class="mqtt-dot" aria-hidden="true"></span>
        <span id="mqttBannerText">MQTT déconnecté</span>
        <button id="mqttBannerCfg" class="mqtt-banner-cfg" type="button">configurer →</button>
      </div>

      <!-- 16 screen containers — contenu injecté par les screen handlers au mount -->
      <main id="mainContent" tabindex="-1">
        <div class="screen-wrap active" id="dashboard" data-screen="dashboard"></div>
        <div class="screen-wrap" id="pots" data-screen="pots"></div>
        <div class="screen-wrap" id="detail" data-screen="detail"></div>
        <div class="screen-wrap" id="stats" data-screen="stats"></div>
        <div class="screen-wrap" id="profiles" data-screen="profiles"></div>
        <div class="screen-wrap" id="system" data-screen="system"></div>
        <div class="screen-wrap" id="tanks" data-screen="tanks"></div>
        <div class="screen-wrap" id="tankDetail" data-screen="tankDetail"></div>
        <div class="screen-wrap" id="tankConfig" data-screen="tankConfig"></div>
        <div class="screen-wrap" id="addTank" data-screen="addTank"></div>
        <div class="screen-wrap" id="tankEdit" data-screen="tankEdit"></div>
        <div class="screen-wrap" id="vacation" data-screen="vacation"></div>
        <div class="screen-wrap" id="configurator" data-screen="configurator"></div>
        <div class="screen-wrap" id="addPot" data-screen="addPot"></div>
        <div class="screen-wrap" id="editPot" data-screen="editPot"></div>
        <div class="screen-wrap" id="addPairing" data-screen="addPairing"></div>
      </main>

      <!-- Bottom nav -->
      <nav class="nav" aria-label="Navigation principale">
        <button class="nav-item" data-nav="dashboard" type="button" aria-label="Tableau de bord">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
          </svg>
          <span>DASH</span>
        </button>
        <button class="nav-item" data-nav="pots" type="button" aria-label="Pots">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M12 2L4 7v7c0 5 8 8 8 8s8-3 8-8V7l-8-5z" />
          </svg>
          <span>POTS</span>
        </button>
        <button class="nav-item" data-nav="tanks" type="button" aria-label="Réservoirs">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M5 3h14a2 2 0 0 1 2 2v3H3V5a2 2 0 0 1 2-2z" />
            <path d="M3 8v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8" />
            <path d="M3 14c2-1 4 1 6 0s4-1 6 0 4 1 6 0" />
          </svg>
          <span>TANKS</span>
        </button>
        <button class="nav-item" data-nav="stats" type="button" aria-label="Statistiques">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M3 3v18h18M7 14l4-4 4 4 6-6" />
          </svg>
          <span>STATS</span>
        </button>
        <button class="nav-item" data-nav="system" type="button" aria-label="Système">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <line x1="8" y1="21" x2="16" y2="21" />
          </svg>
          <span>SYS</span>
        </button>
      </nav>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>

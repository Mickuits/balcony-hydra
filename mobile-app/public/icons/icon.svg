<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background : noir profond avec accent vert subtle -->
  <rect width="512" height="512" fill="#0b0b0b" rx="96"/>

  <!-- Halo vert subtle (radial gradient) -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7cff5a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7cff5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8ff7a"/>
      <stop offset="100%" stop-color="#7cff5a"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="200" r="220" fill="url(#halo)"/>

  <!-- Goutte d'eau stylisée centrée — geometric, pas figuratif -->
  <path d="M 256 88
           C 256 88, 152 220, 152 304
           C 152 364, 198 412, 256 412
           C 314 412, 360 364, 360 304
           C 360 220, 256 88, 256 88 Z"
        fill="url(#dropGrad)"
        stroke="#7cff5a"
        stroke-width="3"/>

  <!-- Inner highlight pour profondeur -->
  <ellipse cx="218" cy="240" rx="22" ry="48" fill="#ffffff" opacity="0.2"/>

  <!-- Lettres BH en monogramme, intégrées dans la goutte -->
  <text x="256" y="340"
        font-family="ui-monospace, 'SF Mono', Monaco, monospace"
        font-size="80"
        font-weight="700"
        fill="#0b0b0b"
        text-anchor="middle"
        letter-spacing="-2">BH</text>
</svg>

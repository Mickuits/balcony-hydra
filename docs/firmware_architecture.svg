<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1010" font-family="Arial, sans-serif">
  <defs>
    <marker id="a"  markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#64748b"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3b82f6"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#22c55e"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#a855f7"/></marker>
    <marker id="ap0" markerWidth="9" markerHeight="7" refX="0" refY="3.5" orient="auto"><polygon points="9 0,0 3.5,9 7" fill="#a855f7"/></marker>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.14"/></filter>
  </defs>

  <rect width="1280" height="1010" fill="#0f172a" rx="8"/>

  <!-- Title -->
  <text x="640" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#22d3ee">BALCONY HYDRA v4 — Architecture Firmware Distribuée</text>
  <text x="640" y="55" text-anchor="middle" font-size="11" fill="#64748b">2× ESP32 WROOM-32 · ESP-NOW (AES-128-CCM) + MQTT fallback · FreeRTOS · PlatformIO (master / slave / common)</text>

  <!-- ============ COMMON BAND ============ -->
  <g filter="url(#s)">
    <rect x="360" y="72" width="560" height="48" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="640" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#f59e0b">firmware/common/  —  code partagé maître + esclave</text>
    <text x="640" y="108" text-anchor="middle" font-size="8.5" fill="#cbd5e1">Protocol.h (messages ESP-NOW packed · CmdType/DataType)  ·  config_common.h (seuils, timing, PMK/LMK, coords Mougins)</text>
  </g>

  <!-- ============================================================ -->
  <!-- ===================  MASTER PANEL  ========================= -->
  <!-- ============================================================ -->
  <rect x="30" y="135" width="510" height="545" rx="10" fill="#111c30" stroke="#3b82f6" stroke-width="2"/>
  <rect x="30" y="135" width="510" height="34" rx="10 10 0 0" fill="#1e3a5f"/>
  <text x="285" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#60a5fa">ESP32 MAÎTRE — Intérieur (Zone B)</text>
  <text x="285" y="164" text-anchor="middle" font-size="8.5" fill="#94a3b8">USB secteur · TFT tactile · Web/MQTT/Telegram/OTA · 16 modules</text>

  <!-- FreeRTOS tasks (master only) -->
  <text x="42" y="187" font-size="9" font-weight="bold" fill="#94a3b8">FreeRTOS — dual-core 240 MHz (4 tâches)</text>
  <g font-size="8">
    <rect x="42"  y="194" width="116" height="40" rx="5" fill="#134e4a" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="100" y="210" text-anchor="middle" fill="#5eead4" font-weight="bold">Sensors</text>
    <text x="100" y="224" text-anchor="middle" fill="#94a3b8">Core1 · 30s · 4KB</text>
    <rect x="166" y="194" width="116" height="40" rx="5" fill="#451a03" stroke="#f97316" stroke-width="1.2"/>
    <text x="224" y="210" text-anchor="middle" fill="#fb923c" font-weight="bold">Pump</text>
    <text x="224" y="224" text-anchor="middle" fill="#94a3b8">Core1 · 1s · Prio2</text>
    <rect x="290" y="194" width="116" height="40" rx="5" fill="#172554" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="348" y="210" text-anchor="middle" fill="#60a5fa" font-weight="bold">WiFi</text>
    <text x="348" y="224" text-anchor="middle" fill="#94a3b8">Core0 · 500ms</text>
    <rect x="414" y="194" width="116" height="40" rx="5" fill="#3b0764" stroke="#a855f7" stroke-width="1.2"/>
    <text x="472" y="210" text-anchor="middle" fill="#c084fc" font-weight="bold">Comms</text>
    <text x="472" y="224" text-anchor="middle" fill="#94a3b8">Core0 · 1s · 8KB</text>
  </g>

  <!-- Master modules (16 chips, 2 cols x 8 rows) -->
  <text x="42" y="252" font-size="9" font-weight="bold" fill="#94a3b8">Modules C++ (lib/)</text>
  <g font-size="8.5" font-weight="bold">
    <!-- row1 -->
    <rect x="42"  y="258" width="232" height="22" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/><text x="52" y="273" fill="#fcd34d">⚙ ConfigManager</text>
    <rect x="298" y="258" width="232" height="22" rx="4" fill="#1e293b" stroke="#14b8a6" stroke-width="1.2"/><text x="308" y="273" fill="#5eead4">📡 SensorManager (MUX×1, US#1)</text>
    <!-- row2 -->
    <rect x="42"  y="284" width="232" height="22" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/><text x="52" y="299" fill="#fb923c">💧 PumpController (Pompe B)</text>
    <rect x="298" y="284" width="232" height="22" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/><text x="308" y="299" fill="#f87171">🛡 SafetyManager (relay+thermal)</text>
    <!-- row3 -->
    <rect x="42"  y="310" width="232" height="22" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/><text x="52" y="325" fill="#60a5fa">📶 WifiManager (AP+STA)</text>
    <rect x="298" y="310" width="232" height="22" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-width="1.2"/><text x="308" y="325" fill="#67e8f9">🌐 WebPortal (REST + token)</text>
    <!-- row4 -->
    <rect x="42"  y="336" width="232" height="22" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/><text x="52" y="351" fill="#c084fc">📊 MqttClient</text>
    <rect x="298" y="336" width="232" height="22" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/><text x="308" y="351" fill="#22d3ee">💬 TelegramBot</text>
    <!-- row5 -->
    <rect x="42"  y="362" width="232" height="22" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.2"/><text x="52" y="377" fill="#a5b4fc">🕐 TimeManager (NTP+DS3231+NOAA)</text>
    <rect x="298" y="362" width="232" height="22" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.2"/><text x="308" y="377" fill="#a5b4fc">😴 SleepManager</text>
    <!-- row6 -->
    <rect x="42"  y="388" width="232" height="22" rx="4" fill="#1e293b" stroke="#84cc16" stroke-width="1.2"/><text x="52" y="403" fill="#bef264">🌿 PlantProfile (apprentissage)</text>
    <rect x="298" y="388" width="232" height="22" rx="4" fill="#1e293b" stroke="#84cc16" stroke-width="1.2"/><text x="308" y="403" fill="#bef264">📅 AutonomyCalculator</text>
    <!-- row7 -->
    <rect x="42"  y="414" width="232" height="22" rx="4" fill="#1e293b" stroke="#84cc16" stroke-width="1.2"/><text x="52" y="429" fill="#bef264">📍 WiFiGeolocation</text>
    <rect x="298" y="414" width="232" height="22" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/><text x="308" y="429" fill="#c084fc">🔗 EspNowMaster (pairing)</text>
    <!-- row8 -->
    <rect x="42"  y="440" width="232" height="22" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-width="1.2"/><text x="52" y="455" fill="#67e8f9">🖥 TftDashboard (7 écrans)</text>
    <rect x="298" y="440" width="232" height="22" rx="4" fill="#1e293b" stroke="#eab308" stroke-width="1.2"/><text x="308" y="455" fill="#fde047">💡 StatusLED</text>
  </g>

  <!-- Master hardware box -->
  <g filter="url(#s)">
    <rect x="42" y="474" width="488" height="194" rx="8" fill="#0c1626" stroke="#334155" stroke-width="1.5"/>
    <text x="52" y="491" font-size="9" font-weight="bold" fill="#94a3b8">HARDWARE MAÎTRE — GPIO / I2C / ADC1 / VSPI</text>
    <g font-size="8.3" fill="#cbd5e1">
      <text x="52" y="510">MUX CD74HC4067 ×1 → 10 capteurs humidité Zone B (SIG GPIO 36, ADC1)</text>
      <text x="52" y="527">US JSN-SR04T ×1 → réservoir intérieur 25 L (TRIG 14 / ECHO 34)</text>
      <text x="52" y="544">Pompe B 12 V → MOSFET D4184 GPIO 27 (pull-down 10kΩ)</text>
      <text x="52" y="561" fill="#f87171">Relay sécurité GPIO 18 — coupe la pompe B si MCU non-responsive</text>
      <text x="52" y="578">I2C GPIO 21/22 → DS3231 RTC (0x68) · pull-up 4.7kΩ</text>
      <text x="52" y="595">TFT ILI9341 + XPT2046 tactile · LED RGB 16/17/2 · Bouton GPIO 5</text>
      <text x="52" y="615" fill="#fbbf24">⚠ Conflit GPIO 18 (Relay) vs VSPI CLK → TFT à passer sur HSPI</text>
      <text x="52" y="629" fill="#64748b">   (décision DECISIONS.md 2026-04-24 ; remap config/SVG au 1er flash HW)</text>
      <text x="52" y="649" fill="#22c55e">Alim : 100 % USB secteur — pas de batterie / solaire</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- ===================  SLAVE PANEL  ========================== -->
  <!-- ============================================================ -->
  <rect x="740" y="135" width="510" height="545" rx="10" fill="#0f2018" stroke="#22c55e" stroke-width="2"/>
  <rect x="740" y="135" width="510" height="34" rx="10 10 0 0" fill="#14532d"/>
  <text x="995" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#4ade80">ESP32 ESCLAVE — Balcon (Zone A)</text>
  <text x="995" y="164" text-anchor="middle" font-size="8.5" fill="#94a3b8">USB secteur · boîtier IP65 · pas de TFT/Web/Telegram · 7 modules</text>

  <!-- Slave loop note -->
  <text x="752" y="187" font-size="9" font-weight="bold" fill="#94a3b8">Exécution — boucle non-RTOS</text>
  <g font-size="8">
    <rect x="752" y="194" width="488" height="40" rx="5" fill="#0c2a1a" stroke="#22c55e" stroke-width="1.2"/>
    <text x="996" y="211" text-anchor="middle" fill="#86efac" font-weight="bold">Loop 10 Hz · callbacks ESP-NOW (RX commandes / TX données)</text>
    <text x="996" y="225" text-anchor="middle" fill="#94a3b8">Mode dégradé autonome si maître perdu (schedule NVS)</text>
  </g>

  <!-- Slave modules (7 chips) -->
  <text x="752" y="252" font-size="9" font-weight="bold" fill="#94a3b8">Modules C++ (lib/) — adaptés esclave</text>
  <g font-size="8.5" font-weight="bold">
    <rect x="752"  y="258" width="232" height="22" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/><text x="762" y="273" fill="#fcd34d">⚙ ConfigManager</text>
    <rect x="1008" y="258" width="232" height="22" rx="4" fill="#1e293b" stroke="#14b8a6" stroke-width="1.2"/><text x="1018" y="273" fill="#5eead4">📡 SensorManager (MUX×1+BME+INA)</text>

    <rect x="752"  y="284" width="232" height="22" rx="4" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/><text x="762" y="299" fill="#fb923c">💧 PumpController (Pompe A)</text>
    <rect x="1008" y="284" width="232" height="22" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/><text x="1018" y="299" fill="#c084fc">🔗 EspNowSlave</text>

    <rect x="752"  y="310" width="232" height="22" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/><text x="762" y="325" fill="#f87171">🛡 SafetyLocal (MOSFET+fusible)</text>
    <rect x="1008" y="310" width="232" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/><text x="1018" y="325" fill="#7dd3fc">🌙 DegradedMode (NVS schedule)</text>

    <rect x="752"  y="336" width="232" height="22" rx="4" fill="#1e293b" stroke="#eab308" stroke-width="1.2"/><text x="762" y="351" fill="#fde047">💡 StatusLED</text>
    <rect x="1008" y="336" width="232" height="22" rx="4" fill="#0f2018" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/><text x="1018" y="351" fill="#475569">(pas de Web / Telegram / TFT)</text>
  </g>

  <!-- Slave hardware box -->
  <g filter="url(#s)">
    <rect x="752" y="382" width="488" height="286" rx="8" fill="#0a1a12" stroke="#334155" stroke-width="1.5"/>
    <text x="762" y="399" font-size="9" font-weight="bold" fill="#94a3b8">HARDWARE ESCLAVE — GPIO / I2C / ADC1</text>
    <g font-size="8.3" fill="#cbd5e1">
      <text x="762" y="420">MUX CD74HC4067 ×1 → 10 capteurs humidité Zone A (SIG GPIO 36, ADC1)</text>
      <text x="762" y="438">US JSN-SR04T ×1 → bidon de tête (2×25 L vases communicants = 50 L)</text>
      <text x="762" y="456">   (TRIG 14 / ECHO 34) — 1 seul US/zone (pas de divergence US en v4)</text>
      <text x="762" y="474">Pompe A 12 V → MOSFET GPIO 27 · fusible 3A + pull-down 10kΩ</text>
      <text x="762" y="492">I2C GPIO 21/22 → BME280 (0x76) + INA219 (0x40) · pull-up 4.7kΩ</text>
      <text x="762" y="510">LED RGB 17/19/23 · LED onboard GPIO 2 (heartbeat)</text>
      <text x="762" y="530" fill="#f87171">Pas de relay côté esclave</text>
      <text x="762" y="544" fill="#64748b">   → protection MOSFET + fusible 3A + firmware SafetyLocal</text>
      <text x="762" y="564" fill="#22c55e">Alim : 100 % USB secteur (prise balcon) — pas de batterie / solaire</text>
    </g>
    <!-- Failsafes recap -->
    <rect x="762" y="578" width="468" height="78" rx="6" fill="#1a0b0b" stroke="#ef4444" stroke-width="1.2"/>
    <text x="772" y="595" font-size="8.5" font-weight="bold" fill="#f87171">Failsafes pompe (communs maître/esclave, tous modes)</text>
    <g font-size="8" fill="#fca5a5">
      <text x="772" y="612">Tank &lt;10% → STOP (auto-recovery)   ·   Runtime &gt;300s → STOP</text>
      <text x="772" y="628">Courant &gt;3A → hard lockout (/unlock)   ·   Dry-run &lt;50mA/3s → hard lockout</text>
      <text x="772" y="644">Thermal &gt;58°C → lockout, reprise &lt;45°C stable 5 min   ·   Pull-down HW</text>
    </g>
  </g>

  <!-- ============ ESP-NOW LINK (center channel) ============ -->
  <g filter="url(#s)">
    <rect x="578" y="320" width="124" height="118" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
    <text x="640" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#c084fc">ESP-NOW</text>
    <text x="640" y="362" text-anchor="middle" font-size="7.5" fill="#ddd6fe">peer-to-peer</text>
    <text x="640" y="376" text-anchor="middle" font-size="7.5" fill="#ddd6fe">AES-128-CCM</text>
    <text x="640" y="390" text-anchor="middle" font-size="7.5" fill="#ddd6fe">unicast chiffré</text>
    <text x="640" y="406" text-anchor="middle" font-size="7.5" fill="#94a3b8">pairing 0xBA</text>
    <text x="640" y="422" text-anchor="middle" font-size="7.5" fill="#94a3b8">+ MQTT fallback</text>
  </g>
  <!-- bidirectional arrows master <-> espnow <-> slave -->
  <line x1="540" y1="362" x2="578" y2="362" stroke="#a855f7" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="578" y1="396" x2="540" y2="396" stroke="#a855f7" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="702" y1="362" x2="740" y2="362" stroke="#a855f7" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="740" y1="396" x2="702" y2="396" stroke="#a855f7" stroke-width="2" marker-end="url(#ap)"/>

  <!-- ============ CLIENT / SERVICES BAND ============ -->
  <rect x="30" y="700" width="1220" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="640" y="721" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">Couche cliente &amp; services — via WiFi routeur (maître)</text>

  <g filter="url(#s)" font-size="8">
    <rect x="40"   y="744" width="228" height="58" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="154" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#67e8f9">📱 App mobile PWA</text>
    <text x="154" y="779" text-anchor="middle" fill="#94a3b8">mobile-app/ (Vite+TS, 16 écrans)</text>
    <text x="154" y="792" text-anchor="middle" fill="#94a3b8">REST X-Hydra-Token + MQTT.js</text>

    <rect x="288"  y="744" width="228" height="58" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="402" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#67e8f9">🌐 WebPortal embarqué</text>
    <text x="402" y="779" text-anchor="middle" fill="#94a3b8">AsyncWebServer :80 (maître)</text>
    <text x="402" y="792" text-anchor="middle" fill="#94a3b8">POST /api/* → token requis</text>

    <rect x="536"  y="744" width="228" height="58" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="650" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#c084fc">📊 Broker MQTT</text>
    <text x="650" y="779" text-anchor="middle" fill="#94a3b8">Mosquitto (1883 + 9001 WS)</text>
    <text x="650" y="792" text-anchor="middle" fill="#94a3b8">hydra/sensors|pump|alerts|cmd</text>

    <rect x="784"  y="744" width="228" height="58" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="898" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#22d3ee">💬 Telegram</text>
    <text x="898" y="779" text-anchor="middle" fill="#94a3b8">Alertes push + heartbeat 12h</text>
    <text x="898" y="792" text-anchor="middle" fill="#94a3b8">/status /water /unlock /autonomy</text>

    <rect x="1032" y="744" width="218" height="58" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="1141" y="764" text-anchor="middle" font-size="10" font-weight="bold" fill="#a5b4fc">🕐 Temps</text>
    <text x="1141" y="779" text-anchor="middle" fill="#94a3b8">NTP pool.ntp.org</text>
    <text x="1141" y="792" text-anchor="middle" fill="#94a3b8">+ DS3231 (maître) + NOAA solaire</text>
  </g>

  <!-- arrows master panel -> services -->
  <line x1="285" y1="680" x2="285" y2="700" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="300" y="694" font-size="7.5" fill="#64748b">WiFi (REST/MQTT/Telegram/NTP)</text>

  <!-- ============ LEGEND / FOOTER ============ -->
  <rect x="30" y="824" width="1220" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="44" y="848" font-size="9" font-weight="bold" fill="#94a3b8">LÉGENDE:</text>
  <rect x="112" y="841" width="14" height="10" rx="2" fill="none" stroke="#3b82f6" stroke-width="1.5"/><text x="130" y="849" font-size="8" fill="#cbd5e1">Maître</text>
  <rect x="182" y="841" width="14" height="10" rx="2" fill="none" stroke="#22c55e" stroke-width="1.5"/><text x="200" y="849" font-size="8" fill="#cbd5e1">Esclave</text>
  <rect x="256" y="841" width="14" height="10" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/><text x="274" y="849" font-size="8" fill="#cbd5e1">Common</text>
  <rect x="334" y="841" width="14" height="10" rx="2" fill="none" stroke="#a855f7" stroke-width="1.5"/><text x="352" y="849" font-size="8" fill="#cbd5e1">ESP-NOW</text>
  <rect x="416" y="841" width="14" height="10" rx="2" fill="none" stroke="#ef4444" stroke-width="1.5"/><text x="434" y="849" font-size="8" fill="#cbd5e1">Sécurité / failsafes</text>
  <text x="640" y="849" font-size="8" fill="#64748b">Maître : 16 modules · 4 tâches FreeRTOS    |    Esclave : 7 modules · loop 10 Hz</text>

  <text x="1250" y="884" text-anchor="end" font-size="7.5" fill="#475569">Balcony Hydra v4 — Firmware Architecture — Rev 2.0 — Mai 2026</text>
</svg>

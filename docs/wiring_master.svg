<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="11">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #2C3E50; }
    .subtitle { font-size: 10px; fill: #7F8C8D; }
    .comp { fill: #ECF0F1; stroke: #2C3E50; stroke-width: 1.5; rx: 4; }
    .esp { fill: #2980B9; stroke: #1A5276; stroke-width: 2; rx: 6; }
    .pin { font-size: 9px; fill: #E74C3C; font-weight: bold; }
    .label { font-size: 10px; fill: #2C3E50; }
    .wire { stroke: #E74C3C; stroke-width: 1.5; fill: none; }
    .wire-gnd { stroke: #2C3E50; stroke-width: 1.5; fill: none; stroke-dasharray: 4,2; }
    .wire-i2c { stroke: #8E44AD; stroke-width: 1.5; fill: none; }
    .wire-spi { stroke: #E67E22; stroke-width: 1.5; fill: none; }
    .note { font-size: 8px; fill: #95A5A6; }
  </style>

  <text x="450" y="25" text-anchor="middle" class="title">WIRING — ESP32 MAÎTRE (Intérieur)</text>
  <text x="450" y="40" text-anchor="middle" class="subtitle">USB 5V · TFT ILI9341 · DS3231 · Pompe B · 10 capteurs · Relay sécurité</text>

  <!-- ESP32 -->
  <rect x="340" y="80" width="220" height="320" class="esp"/>
  <text x="450" y="100" text-anchor="middle" fill="white" font-size="13" font-weight="bold">ESP32 WROOM-32</text>
  <text x="450" y="115" text-anchor="middle" fill="#AED6F1" font-size="9">MAÎTRE — Breakout borniers</text>

  <!-- Left pins -->
  <text x="348" y="145" class="pin">G36</text><text x="390" y="145" class="label">← MUX SIG (ADC1)</text>
  <text x="348" y="165" class="pin">G34</text><text x="390" y="165" class="label">← US ECHO (input only)</text>
  <text x="348" y="185" class="pin">G32</text><text x="390" y="185" class="label">→ MUX S0</text>
  <text x="348" y="205" class="pin">G33</text><text x="390" y="205" class="label">→ MUX S1</text>
  <text x="348" y="225" class="pin">G25</text><text x="390" y="225" class="label">→ MUX S2</text>
  <text x="348" y="245" class="pin">G26</text><text x="390" y="245" class="label">→ MUX S3</text>
  <text x="348" y="265" class="pin">G27</text><text x="390" y="265" class="label">→ MOSFET Pompe B</text>
  <text x="348" y="285" class="pin">G14</text><text x="390" y="285" class="label">→ US TRIGGER</text>
  <text x="348" y="305" class="pin">G12</text><text x="390" y="305" class="label">→ TFT DC</text>

  <!-- Right pins -->
  <text x="540" y="145" class="pin">G21</text><text x="498" y="145" class="label" text-anchor="end">SDA I2C →</text>
  <text x="540" y="165" class="pin">G22</text><text x="498" y="165" class="label" text-anchor="end">SCL I2C →</text>
  <text x="540" y="185" class="pin">G18</text><text x="498" y="185" class="label" text-anchor="end">Relay sécurité →</text>
  <text x="540" y="205" class="pin">G5</text><text x="498" y="205" class="label" text-anchor="end">← Bouton</text>
  <text x="540" y="225" class="pin">G16</text><text x="498" y="225" class="label" text-anchor="end">LED R →</text>
  <text x="540" y="245" class="pin">G17</text><text x="498" y="245" class="label" text-anchor="end">LED G →</text>
  <text x="540" y="265" class="pin">G2</text><text x="498" y="265" class="label" text-anchor="end">LED B →</text>
  <text x="540" y="285" class="pin">G23</text><text x="498" y="285" class="label" text-anchor="end">SPI MOSI →</text>
  <text x="540" y="305" class="pin">G35</text><text x="498" y="305" class="label" text-anchor="end">SPI MISO → (input-only)</text>
  <text x="540" y="325" class="pin">G19</text><text x="498" y="325" class="label" text-anchor="end">SPI CLK →</text>
  <text x="540" y="345" class="pin">G13</text><text x="498" y="345" class="label" text-anchor="end">TFT CS →</text>
  <text x="540" y="365" class="pin">G15</text><text x="498" y="365" class="label" text-anchor="end">TOUCH CS →</text>
  <text x="540" y="385" class="pin">G4</text><text x="498" y="385" class="label" text-anchor="end">MUX EN →</text>

  <!-- Components -->
  <!-- MUX -->
  <rect x="30" y="130" width="160" height="80" class="comp"/>
  <text x="110" y="155" text-anchor="middle" class="label" font-weight="bold">MUX CD74HC4067</text>
  <text x="110" y="170" text-anchor="middle" class="note">10 capteurs humidité</text>
  <text x="110" y="185" text-anchor="middle" class="note">Zone B (intérieur)</text>
  <line x1="190" y1="145" x2="340" y2="145" class="wire"/>

  <!-- US Sensor -->
  <rect x="30" y="240" width="160" height="60" class="comp"/>
  <text x="110" y="265" text-anchor="middle" class="label" font-weight="bold">JSN-SR04T US</text>
  <text x="110" y="280" text-anchor="middle" class="note">Réservoir intérieur 25L</text>

  <!-- Pompe B -->
  <rect x="30" y="330" width="160" height="60" class="comp"/>
  <text x="110" y="350" text-anchor="middle" class="label" font-weight="bold">MOSFET D4184</text>
  <text x="110" y="365" text-anchor="middle" class="note">Pompe B péristaltique 12V</text>
  <text x="110" y="378" text-anchor="middle" class="note">+ pull-down 10kΩ</text>

  <!-- DS3231 -->
  <rect x="640" y="120" width="130" height="60" class="comp"/>
  <text x="705" y="145" text-anchor="middle" class="label" font-weight="bold">DS3231 RTC</text>
  <text x="705" y="160" text-anchor="middle" class="note">I2C 0x68 + CR2032</text>
  <line x1="560" y1="145" x2="640" y2="145" class="wire-i2c"/>

  <!-- TFT -->
  <rect x="640" y="260" width="200" height="90" class="comp"/>
  <text x="740" y="285" text-anchor="middle" class="label" font-weight="bold">LCD TFT 2.4" ILI9341</text>
  <text x="740" y="300" text-anchor="middle" class="note">320×240 + XPT2046 tactile</text>
  <text x="740" y="315" text-anchor="middle" class="note">SPI: MOSI=23 MISO=35 CLK=19</text>
  <text x="740" y="330" text-anchor="middle" class="note">CS=13 DC=12 TOUCH_CS=15</text>
  <line x1="560" y1="290" x2="640" y2="290" class="wire-spi"/>

  <!-- Relay -->
  <rect x="640" y="190" width="130" height="50" class="comp"/>
  <text x="705" y="210" text-anchor="middle" class="label" font-weight="bold">Relais sécurité</text>
  <text x="705" y="225" text-anchor="middle" class="note">NO — coupe pompe B</text>
  <line x1="560" y1="185" x2="640" y2="210" class="wire"/>

  <!-- LED RGB -->
  <rect x="640" y="380" width="130" height="50" class="comp"/>
  <text x="705" y="400" text-anchor="middle" class="label" font-weight="bold">LED RGB</text>
  <text x="705" y="415" text-anchor="middle" class="note">R=G16 G=G17 B=G2</text>

  <!-- Bouton -->
  <rect x="640" y="440" width="130" height="40" class="comp"/>
  <text x="705" y="460" text-anchor="middle" class="label" font-weight="bold">Bouton IP67</text>
  <text x="705" y="475" text-anchor="middle" class="note">GPIO 5 + pull-up</text>

  <!-- Power -->
  <rect x="340" y="430" width="220" height="40" class="comp" style="fill:#F9E79F"/>
  <text x="450" y="455" text-anchor="middle" class="label" font-weight="bold">🔌 USB 5V Secteur</text>

  <!-- Legend -->
  <rect x="30" y="450" width="280" height="100" fill="#F8F9FA" stroke="#BDC3C7" rx="4"/>
  <text x="40" y="470" class="label" font-weight="bold">Légende:</text>
  <line x1="40" y1="485" x2="80" y2="485" class="wire"/><text x="85" y="489" class="note">Signal / GPIO</text>
  <line x1="40" y1="500" x2="80" y2="500" class="wire-i2c"/><text x="85" y="504" class="note">I2C (SDA/SCL)</text>
  <line x1="40" y1="515" x2="80" y2="515" class="wire-spi"/><text x="85" y="519" class="note">SPI (TFT)</text>
  <line x1="40" y1="530" x2="80" y2="530" class="wire-gnd"/><text x="85" y="534" class="note">GND</text>
  <text x="180" y="489" class="note">LED RGB sur G16/G17/G2 (hors bus SPI)</text>
  <text x="180" y="504" class="note">SPI TFT remappé : CLK 18→19, MISO 19→35</text>
  <text x="180" y="519" class="note" fill="#0a0" font-weight="bold">✓ Conflit G18 résolu : Relay seul sur G18</text>
  <text x="180" y="534" class="note" fill="#64748b">G35 input-only = valide pour MISO (entrée). À valider au 1er flash HW.</text>
</svg>
